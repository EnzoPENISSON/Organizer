name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Organizer is a Windows-only app: the `windows` crate does not build on Linux,
    # and the icon/manifest embedding needs the MSVC linker.
    runs-on: windows-latest
    permissions:
      contents: write  # to create the release

    steps:
    - uses: actions/checkout@v4

    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --release --verbose

    - name: Run tests
      run: cargo test --verbose

    # Tags look like v0.1.0-build.12: the Cargo.toml version and the run number, which
    # build.rs also bakes into the exe so the in-app update check can compare them.
    - name: Version
      id: version
      shell: bash
      run: |
        version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

    - name: Build installer
      shell: pwsh
      run: |
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
        & $iscc /DAppVersion=${{ steps.version.outputs.version }} /DAppBuild=$env:GITHUB_RUN_NUMBER installer\organizer.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - uses: actions/upload-artifact@v4
      with:
        name: Organizer-Setup-${{ steps.version.outputs.tag }}
        path: target/installer/Organizer-Setup-${{ steps.version.outputs.tag }}.exe

    # Every push to master publishes a release with the installer. Pull requests only build.
    # The installer's name must start with Organizer-Setup-: the in-app updater looks for it.
    - name: Create release
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.version.outputs.tag }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        gh release create "$TAG" "target/installer/Organizer-Setup-$TAG.exe" \
          --target "$GITHUB_SHA" \
          --title "Organizer $VERSION" \
          --generate-notes
